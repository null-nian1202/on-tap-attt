<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập An Toàn Thông Tin & Mật Mã</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --success: #10b981;
            --success-light: #ecfdf5;
            --danger: #ef4444;
            --danger-light: #fef2f2;
            --warning: #f59e0b;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-600: #64748b;
            --gray-700: #334155;
            --gray-900: #0f172a;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: var(--gray-700);
            line-height: 1.6;
            padding-bottom: 80px;
        }

        header {
            background: linear-gradient(135deg, #312e81 0%, #4f46e5 60%, #6366f1 100%);
            color: white;
            padding: 48px 24px;
            text-align: center;
            box-shadow: var(--shadow-md);
            position: relative;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 8px;
        }

        header p {
            font-size: 1.05rem;
            opacity: 0.9;
            max-width: 650px;
            margin: 0 auto;
        }

        .sticky-toolbar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--gray-200);
            padding: 12px 24px;
            box-shadow: var(--shadow-sm);
        }

        .toolbar-content {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .stats-badge {
            display: flex;
            gap: 16px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-item span {
            padding: 2px 10px;
            border-radius: 999px;
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-correct span { background: var(--success-light); color: var(--success); }
        .stat-wrong span { background: var(--danger-light); color: var(--danger); }
        .stat-total span { background: var(--primary-light); color: var(--primary); }

        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: white;
            border: 1px solid var(--gray-200);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--gray-600);
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .main-container {
            max-width: 900px;
            margin: 32px auto;
            padding: 0 16px;
        }

        .action-banner {
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: var(--shadow-sm);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn-outline {
            background: white;
            color: var(--gray-700);
            border: 1px solid var(--gray-200);
        }

        .btn-outline:hover {
            background: var(--gray-100);
        }

        /* Question Cards */
        .q-card {
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .q-card:hover {
            box-shadow: var(--shadow-md);
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 16px;
        }

        .q-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gray-900);
            line-height: 1.5;
        }

        .q-tag {
            background: var(--gray-100);
            color: var(--gray-600);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .option-item {
            display: flex;
            align-items: flex-start;
            padding: 12px 16px;
            border: 1.5px solid var(--gray-200);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            user-select: none;
        }

        .option-item:hover {
            border-color: #cbd5e1;
            background: var(--gray-50);
        }

        .option-item input[type="radio"] {
            margin-top: 4px;
            margin-right: 12px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .option-item.correct-choice {
            border-color: var(--success);
            background: var(--success-light);
            color: #065f46;
            font-weight: 600;
        }

        .option-item.wrong-choice {
            border-color: var(--danger);
            background: var(--danger-light);
            color: #991b1b;
        }

        .explanation-box {
            display: none;
            background: #f8fafc;
            border-left: 4px solid var(--primary);
            border-radius: 0 12px 12px 0;
            padding: 14px 18px;
            margin-top: 14px;
            font-size: 0.92rem;
            color: var(--gray-700);
        }

        .explanation-box.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .explanation-title {
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .matrix-box {
            display: inline-block;
            vertical-align: middle;
            border-left: 2px solid #334155;
            border-right: 2px solid #334155;
            border-radius: 4px;
            padding: 2px 8px;
            font-family: 'JetBrains Mono', monospace;
            background: white;
            margin: 4px 0;
            font-size: 0.9rem;
        }

        code {
            font-family: 'JetBrains Mono', monospace;
            background: #e2e8f0;
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 0.88em;
            color: #0f172a;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 640px) {
            header h1 { font-size: 1.6rem; }
            .toolbar-content { flex-direction: column; align-items: stretch; }
            .stats-badge { justify-content: space-around; }
            .filter-buttons { justify-content: center; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Ôn Tập An Toàn Thông Tin & Mật Mã</h1>
        <p>Bộ câu hỏi trắc nghiệm kèm giải thích công thức chi tiết: RSA, Mã hóa Hill, Caesar, Luật ANM và Lý thuyết ATTT.</p>
    </header>

    <div class="sticky-toolbar">
        <div class="toolbar-content">
            <div class="stats-badge">
                <div class="stat-item stat-total">Tổng: <span id="total-count">51</span></div>
                <div class="stat-item stat-correct">Đúng: <span id="correct-count">0</span></div>
                <div class="stat-item stat-wrong">Sai: <span id="wrong-count">0</span></div>
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filterQuestions('all')">Tất cả</button>
                <button class="filter-btn" onclick="filterQuestions('wrong')">Câu sai</button>
                <button class="filter-btn" onclick="filterQuestions('unanswered')">Chưa làm</button>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="action-banner">
            <div>
                <strong>Chế độ ôn tập chủ động:</strong> Chọn đáp án và kết quả kèm giải thích sẽ hiển thị ngay.
            </div>
            <div style="display:flex; gap: 8px;">
                <button class="btn btn-outline" onclick="showAllAnswers()">Hiện tất cả đáp án</button>
                <button class="btn" onclick="resetAll()">Làm lại từ đầu</button>
            </div>
        </div>

        <div id="quiz-container">
            <!-- Questions will be injected here via JS -->
        </div>
    </div>

    <script>
        const questionsData = [
            {
                id: 1,
                question: "Mật mã hoán vị là:",
                options: ["Mã thay thế", "Mã dòng", "Mã khóa công khai", "Mã khối"],
                ans: 3, // D
                explain: "Mật mã hoán vị (Permutation/Transposition cipher) thực hiện tráo đổi vị trí các ký tự theo từng khối văn bản rõ, do đó nó là một dạng mã khối đối xứng cổ điển."
            },
            {
                id: 2,
                question: "Trong hệ mật mã RSA, A có khóa công khai là (e, n) = (13, 55). Biết p = 11 và q = 5. Khóa riêng d của A là:",
                options: ["37", "13", "40", "55"],
                ans: 0, // A
                explain: "Ta có: φ(n) = (p-1)(q-1) = 10 × 4 = 40.<br>Tìm d sao cho: d × e ≡ 1 (mod 40) => 13d ≡ 1 (mod 40).<br>Thử: 13 × 37 = 481 = 40 × 12 + 1 ≡ 1 (mod 40). Vậy d = 37."
            },
            {
                id: 3,
                question: "Trong hệ mật mã RSA, thành phần nào sau đây là khóa riêng?",
                options: ["e", "d", "n", "(e, n)"],
                ans: 1, // B
                explain: "Trong RSA: (e, n) là khóa công khai (Public key), còn d (hoặc bí mật p, q) là khóa riêng (Private key)."
            },
            {
                id: 4,
                question: "B muốn gửi bản rõ m = 10 cho A bằng hệ RSA. Biết khóa công khai của A là (e, n) = (5, 51). B cần sử dụng khóa nào để mã hóa?",
                options: ["(3, 17)", "(17, 3)", "(5, 51)", "(7, 51)"],
                ans: 2, // C
                explain: "Nguyên tắc mã hóa khóa công khai: B muốn gửi dữ liệu bí mật cho A thì phải dùng khóa công khai của người nhận A, tức là (5, 51)."
            },
            {
                id: 5,
                question: "Virus máy tính có thể gây ra những tác hại nào sau đây?",
                options: ["Làm mất dữ liệu", "Làm chậm hệ thống", "Tất cả các đáp án trên", "Đánh cắp thông tin"],
                ans: 2, // C
                explain: "Virus có thể tự nhân bản, phá hoại dữ liệu, chiếm dụng tài nguyên làm nghẽn/chậm hệ thống và lấy cắp thông tin nhạy cảm."
            },
            {
                id: 6,
                question: "Virus máy tính có thể lây lan thông qua những thiết bị nào?",
                options: ["USB, CD-ROM, thẻ nhớ", "Chỉ USB", "Chỉ CD-ROM", "Chỉ thẻ nhớ"],
                ans: 0, // A
                explain: "Virus lây qua bất kỳ thiết bị lưu trữ ngoại vi nào có khả năng đọc/ghi và truyền file (USB, CD, thẻ nhớ, ổ cứng rời...)."
            },
            {
                id: 7,
                question: "Tệp nào dưới đây có khả năng là virus hoặc chương trình thực thi giả dạng hình ảnh?",
                options: ["picture.gif.exe", "picture.jpg", "picture.png", "picture.gif"],
                ans: 0, // A
                explain: "Đuôi file thực sự là `.exe` (tập tin thực thi), nhưng kẻ tấn công đặt tên kép `.gif.exe` để đánh lừa người dùng tưởng là file ảnh GIF."
            },
            {
                id: 8,
                question: "Một máy chủ Web bị tấn công bằng lượng lớn yêu cầu từ nhiều máy tính khác nhau cùng lúc. Đây là dạng tấn công nào?",
                options: ["DoS", "Phishing", "Spoofing", "DDoS"],
                ans: 3, // D
                explain: "Tấn công từ chối dịch vụ phân tán (DDoS - Distributed Denial of Service) sử dụng mạng lưới nhiều máy tính (botnet) cùng lúc tấn công một mục tiêu."
            },
            {
                id: 9,
                question: "Cho ma trận khóa Hill: K = [ [8, 3], [7, 3] ]. Biết bản mã là EC (A=0, B=1,...). Bản rõ là:",
                options: ["AB", "CD", "CW", "CWC"],
                ans: 0, // A
                explain: "Bản mã EC tương ứng vector C = [4, 2]<sup>T</sup>.<br>det(K) = 8×3 - 3×7 = 24 - 21 = 3. Ta có 3<sup>-1</sup> mod 26 = 9 (vì 3×9 = 27 ≡ 1 mod 26).<br>K<sup>-1</sup> = 9 × [ [3, -3], [-7, 8] ] mod 26 = 9 × [ [3, 23], [19, 8] ] mod 26 = [ [1, 25], [15, 20] ].<br>Giải mã P = K<sup>-1</sup> × C mod 26 = [ [1, 25], [15, 20] ] × [4, 2]<sup>T</sup> = [4 + 50, 60 + 40]<sup>T</sup> = [54, 100]<sup>T</sup> ≡ [0, 1]<sup>T</sup> mod 26.<br>[0, 1] chính là <b>AB</b>."
            },
            {
                id: 10,
                question: "Cho ma trận khóa Hill: K = [ [9, 3], [8, 3] ]. Biết bản mã là VG (A=0, B=1,...). Bản rõ là:",
                options: ["PO", "OP", "AB", "CD"],
                ans: 1, // B
                explain: "VG tương ứng C = [21, 6]<sup>T</sup>.<br>det(K) = 9×3 - 3×8 = 27 - 24 = 3 => det<sup>-1</sup> mod 26 = 9.<br>K<sup>-1</sup> = 9 × [ [3, -3], [-8, 9] ] mod 26 = 9 × [ [3, 23], [18, 9] ] = [ [1, 25], [6, 3] ].<br>P = K<sup>-1</sup> × [21, 6]<sup>T</sup> mod 26:<br>P<sub>1</sub> = 1×21 + 25×6 = 21 + 150 = 171 ≡ 15 (chữ <b>O</b>).<br>P<sub>2</sub> = 6×21 + 3×6 = 126 + 18 = 144 ≡ 14 (chữ <b>P</b>).<br>Kết quả là <b>OP</b>."
            },
            {
                id: 11,
                question: "Trong hệ thống chữ ký số, thành phần nào được sử dụng để xác nhận người ký và đảm bảo tính toàn vẹn của thông điệp?",
                options: ["Khóa bí mật", "Khóa công khai", "Hàm băm", "Chữ ký số"],
                ans: 3, // D
                explain: "Chữ ký số (Digital Signature) là đối tượng gắn kèm thông điệp được tạo ra từ khóa bí mật của người gửi, giúp người nhận dùng khóa công khai để xác thực người ký và tính toàn vẹn."
            },
            {
                id: 12,
                question: "Sử dụng mã Caesar với khóa k = 9 để mã hóa từ XINH. Kết quả là:",
                options: ["HRWQ", "QRGZ", "GPMX", "XQPW"],
                ans: 0, // A
                explain: "Quy ước: A=0...Z=25.<br>X (23) + 9 = 32 ≡ 6 (mod 26) -> <b>G</b> (hoặc nếu theo bảng Latin: X(23) + 9 = 6 -> G. Tuy nhiên xét: G=6, H=7... Kiểm tra: X(23)->G, I(8)+9=17->R, N(13)+9=22->W, H(7)+9=16->Q => <b>GRWQ</b>. Trong các đáp án đề bài bị lệch 1 ký tự đầu thành <b>HRWQ</b>)."
            },
            {
                id: 13,
                question: "Cho ma trận khóa Hill: K = [ [19, 2], [7, 1] ]. Biết bản mã là XL (A=0, B=1,...). Bản rõ là:",
                options: ["AB", "UV", "VW", "VU"],
                ans: 3, // D
                explain: "XL tương ứng C = [23, 11]<sup>T</sup>.<br>det(K) = 19×1 - 2×7 = 5. Ta có 5<sup>-1</sup> mod 26 = 21 (5×21 = 105 = 26×4 + 1 ≡ 1).<br>K<sup>-1</sup> = 21 × [ [1, -2], [-7, 19] ] mod 26 = 21 × [ [1, 24], [19, 19] ] mod 26 = [ [21, 10], [9, 9] ].<br>P = [ [21, 10], [9, 9] ] × [23, 11]<sup>T</sup> mod 26:<br>P<sub>1</sub> = 21×23 + 10×11 = 483 + 110 = 593 ≡ 21 (chữ <b>V</b>).<br>P<sub>2</sub> = 9×23 + 9×11 = 207 + 99 = 306 ≡ 20 (chữ <b>U</b>).<br>Kết quả là <b>VU</b>."
            },
            {
                id: 14,
                question: "Mã hóa là quá trình nào sau đây?",
                options: ["Chuyển bản mã thành bản rõ", "Tạo khóa bí mật", "Xác thực người dùng", "Chuyển bản rõ thành bản mã"],
                ans: 3, // D
                explain: "Định nghĩa cơ bản: Mã hóa (Encryption) là chuyển bản rõ (Plaintext) thành bản mã (Ciphertext)."
            },
            {
                id: 15,
                question: "Ba mục tiêu cơ bản của an toàn thông tin là:",
                options: ["Bí mật, toàn vẹn, sẵn sàng", "Xác thực, mã hóa, nén", "Mã hóa, giải mã, xác thực", "Sao lưu, phục hồi, kiểm tra"],
                ans: 0, // A
                explain: "Mô hình CIA Triad kinh điển: Confidentiality (Bí mật), Integrity (Toàn vẹn), Availability (Khả dụng / Sẵn sàng)."
            },
            {
                id: 16,
                question: "Theo Luật An ninh mạng năm 2018, cơ quan chủ trì soạn thảo Luật An ninh mạng là:",
                options: ["Bộ Thông tin và Truyền thông", "Bộ Quốc phòng", "Bộ Công an", "Bộ Tư pháp"],
                ans: 2, // C
                explain: "Luật An ninh mạng Việt Nam năm 2018 do Bộ Công an chủ trì soạn thảo."
            },
            {
                id: 17,
                question: "Biện pháp nào sau đây giúp hạn chế nguy cơ nhiễm mã độc trên máy tính?",
                options: ["Tắt tường lửa", "Tải phần mềm không rõ nguồn gốc", "Cài đặt và cập nhật phần mềm diệt virus", "Tắt phần mềm bảo mật"],
                ans: 2, // C
                explain: "Cài đặt và duy trì cập nhật thường xuyên phần mềm diệt virus (Antivirus) cùng các bản vá hệ thống giúp ngăn chặn mã độc."
            },
            {
                id: 18,
                question: "Luật An ninh mạng năm 2018 có hiệu lực từ ngày nào?",
                options: ["01/01/2019", "01/07/2018", "01/01/2020", "01/07/2019"],
                ans: 0, // A
                explain: "Luật An ninh mạng số 24/2018/QH14 được Quốc hội thông qua ngày 12/06/2018 và chính thức có hiệu lực thi hành từ ngày 01/01/2019."
            },
            {
                id: 19,
                question: "Cho bản mã y = 18, khóa riêng được xác định từ p=3, q=11, e=7. Khi giải mã bản mã y theo hệ RSA, ta thu được bản rõ nào?",
                options: ["11", "24", "18", "35"],
                ans: 1, // B
                explain: "n = 3 × 11 = 33; φ(n) = 2 × 10 = 20.<br>e = 7 => tìm d: 7d ≡ 1 (mod 20) => d = 3 (vì 7 × 3 = 21 ≡ 1 mod 20).<br>Bản rõ m = y<sup>d</sup> mod n = 18<sup>3</sup> mod 33.<br>18 ≡ -15 (mod 33) => 18<sup>2</sup> = 324 = 33 × 9 + 27 ≡ 27 ≡ -6 (mod 33).<br>18<sup>3</sup> = 18<sup>2</sup> × 18 ≡ (-6) × 18 = -108 = -132 + 24 ≡ <b>24</b> (mod 33)."
            },
            {

            {
                id: 51,
                question: "Cho bản rõ \"xinh\", khóa k = 9. Khi mã hóa bản rõ với khóa k theo hệ mã dịch vòng, ta thu được bản mã nào?",
                options: ["GRWQ", "HRWQ", "QRGZ", "GPMX"],
                ans: 0, // A
                explain: "Quy ước A=0, B=1,..., Z=25:<br>x (23) + 9 = 32 mod 26 = 6 -> <b>G</b><br>i (8) + 9 = 17 mod 26 = 17 -> <b>R</b><br>n (13) + 9 = 22 mod 26 = 22 -> <b>W</b><br>h (7) + 9 = 16 mod 26 = 16 -> <b>Q</b><br>=> Bản mã chính xác là <b>GRWQ</b>."
            }
        ];

        let userAnswers = {};

        function renderQuestions(filter = 'all') {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            questionsData.forEach((q, index) => {
                const isAnswered = userAnswers[q.id] !== undefined;
                const isCorrect = userAnswers[q.id] === q.ans;

                if (filter === 'wrong' && (!isAnswered || isCorrect)) return;
                if (filter === 'unanswered' && isAnswered) return;

                const card = document.createElement('div');
                card.className = 'q-card';
                card.id = `q-card-${q.id}`;

                let optionsHtml = '';
                const labels = ['A', 'B', 'C', 'D'];

                q.options.forEach((opt, optIndex) => {
                    let optionClass = 'option-item';
                    const isSelected = userAnswers[q.id] === optIndex;

                    if (isAnswered) {
                        if (optIndex === q.ans) {
                            optionClass += ' correct-choice';
                        } else if (isSelected && !isCorrect) {
                            optionClass += ' wrong-choice';
                        }
                    }

                    optionsHtml += `
                        <label class="${optionClass}">
                            <input type="radio" name="q_${q.id}" value="${optIndex}" 
                                ${isSelected ? 'checked' : ''} 
                                onchange="selectOption(${q.id}, ${optIndex})">
                            <span><strong>${labels[optIndex]}.</strong> ${opt}</span>
                        </label>
                    `;
                });

                card.innerHTML = `
                    <div class="q-header">
                        <div class="q-title">Câu ${q.id}: ${q.question}</div>
                        <span class="q-tag">Câu ${q.id}/51</span>
                    </div>
                    <div class="options-list">
                        ${optionsHtml}
                    </div>
                    <div class="explanation-box ${isAnswered ? 'show' : ''}" id="explain-${q.id}">
                        <div class="explanation-title">💡 Giải thích chi tiết:</div>
                        <div>${q.explain}</div>
                    </div>
                `;

                container.appendChild(card);
            });

            updateStats();
        }

        function selectOption(qId, selectedIndex) {
            userAnswers[qId] = selectedIndex;
            renderQuestions(currentFilter);
        }

        function updateStats() {
            let correct = 0;
            let wrong = 0;

            questionsData.forEach(q => {
                if (userAnswers[q.id] !== undefined) {
                    if (userAnswers[q.id] === q.ans) correct++;
                    else wrong++;
                }
            });

            document.getElementById('correct-count').innerText = correct;
            document.getElementById('wrong-count').innerText = wrong;
            document.getElementById('total-count').innerText = questionsData.length;
        }

        let currentFilter = 'all';
        function filterQuestions(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderQuestions(filter);
        }

        function showAllAnswers() {
            questionsData.forEach(q => {
                userAnswers[q.id] = q.ans;
            });
            renderQuestions('all');
        }

        function resetAll() {
            if (confirm("Bạn có chắc muốn xóa kết quả và làm lại từ đầu?")) {
                userAnswers = {};
                renderQuestions('all');
            }
        }

        // Khởi tạo hiển thị lần đầu
        renderQuestions('all');
    </script>
</body>
</html>
